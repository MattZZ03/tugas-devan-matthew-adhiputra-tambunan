<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Javascript Simple Calculator</title>
        <link rel="stylesheet" href="calc.css">
    </head>
    
    <body>
        <h1>Calculator</h1>

            <h2>Enter First Number</h2>
            <input class="box" type="number" id="num1" placeholder="Enter first number"> <br>
            
            <h2>Enter Second Number</h2>
            <input class="box" type="number" id="num2" placeholder="Enter second number"> <br>
            
            <button class="tombol" id="add">+</button>
            <button class="tombol" id="subtract">-</button>
            <button class="tombol" id="multiply">×</button>
            <button class="tombol" id="divide">÷</button> <br>
            
            <h2>Result: <span id="result">0</span></h2>

        
        <script src="calc.js"></script>
    </body>
    
    </html>
